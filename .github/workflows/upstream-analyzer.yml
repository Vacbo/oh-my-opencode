name: Upstream Analyzer

# AI-powered cost-benefit review of an upstream release window.
# Pipeline (3 passes):
#   1. Per-commit classification (GOOD / NEEDS_REVIEW / SLOP) via gpt-4.1-mini
#   2. Slop verification of SLOP candidates via gpt-5-mini (stronger reasoning)
#   3. Release synthesis via gpt-4.1 (final recommendation)
#
# Output:
#   - One issue with the full cost-benefit report
#   - Up to 3 draft PRs (good / review / slop batches) with cherry-picked commits
#
# Phase 1 posture: ADVISORY ONLY. No auto-merge. No auto-publish.
# Merges and release publishes remain manual decisions by the maintainer.

run-name: "Upstream: ${{ github.event.inputs.from_tag || github.event.client_payload.from_tag }} → ${{ github.event.inputs.to_tag || github.event.client_payload.to_tag }}"

on:
  repository_dispatch:
    types: [upstream-tag-detected]
  workflow_dispatch:
    inputs:
      from_tag:
        description: "Starting upstream tag (exclusive, e.g. v3.17.0)"
        required: true
        type: string
      to_tag:
        description: "Ending upstream tag (inclusive, e.g. v3.17.4)"
        required: true
        type: string
      upstream_repo:
        description: "Upstream repo slug (owner/name)"
        required: false
        default: "code-yeongyu/oh-my-openagent"
        type: string
      push_branches:
        description: "Push batch branches to origin (needed for draft PRs)"
        required: false
        default: true
        type: boolean
      classify_chain:
        description: "Comma-separated provider:model chain for pass 1 (per-commit classify)"
        required: false
        default: "github:openai/gpt-4.1-mini,openrouter:qwen/qwen3-coder:free,nvidia:nvidia/llama-3.3-nemotron-super-49b-v1"
        type: string
      slop_verify_chain:
        description: "Comma-separated provider:model chain for pass 2 (slop verification)"
        required: false
        default: "nvidia:nvidia/llama-3.3-nemotron-super-49b-v1,openrouter:nvidia/nemotron-3-super-120b-a12b:free,github:openai/gpt-4.1"
        type: string
      synthesis_chain:
        description: "Comma-separated provider:model chain for pass 3 (release synthesis)"
        required: false
        default: "openrouter:qwen/qwen3-next-80b-a3b-instruct:free,nvidia:nvidia/llama-3.3-nemotron-super-49b-v1,github:openai/gpt-4.1"
        type: string

concurrency:
  group: upstream-analyzer-${{ github.event.inputs.to_tag || github.event.client_payload.to_tag }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  models: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - name: Resolve inputs
        id: inputs
        env:
          DISPATCH_FROM: ${{ github.event.client_payload.from_tag }}
          DISPATCH_TO: ${{ github.event.client_payload.to_tag }}
          DISPATCH_REPO: ${{ github.event.client_payload.upstream_repo }}
          INPUT_FROM: ${{ github.event.inputs.from_tag }}
          INPUT_TO: ${{ github.event.inputs.to_tag }}
          INPUT_REPO: ${{ github.event.inputs.upstream_repo }}
          INPUT_PUSH: ${{ github.event.inputs.push_branches }}
          INPUT_CLASSIFY_CHAIN: ${{ github.event.inputs.classify_chain }}
          INPUT_SLOP_VERIFY_CHAIN: ${{ github.event.inputs.slop_verify_chain }}
          INPUT_SYNTHESIS_CHAIN: ${{ github.event.inputs.synthesis_chain }}
        run: |
          set -euo pipefail
          FROM_TAG="${INPUT_FROM:-$DISPATCH_FROM}"
          TO_TAG="${INPUT_TO:-$DISPATCH_TO}"
          UPSTREAM_REPO="${INPUT_REPO:-${DISPATCH_REPO:-code-yeongyu/oh-my-openagent}}"
          PUSH_BRANCHES="${INPUT_PUSH:-true}"
          CLASSIFY_CHAIN_DEFAULT="github:openai/gpt-4.1-mini,openrouter:qwen/qwen3-coder:free,nvidia:nvidia/llama-3.3-nemotron-super-49b-v1"
          SLOP_VERIFY_CHAIN_DEFAULT="nvidia:nvidia/llama-3.3-nemotron-super-49b-v1,openrouter:nvidia/nemotron-3-super-120b-a12b:free,github:openai/gpt-4.1"
          SYNTHESIS_CHAIN_DEFAULT="openrouter:qwen/qwen3-next-80b-a3b-instruct:free,nvidia:nvidia/llama-3.3-nemotron-super-49b-v1,github:openai/gpt-4.1"
          CLASSIFY_CHAIN="${INPUT_CLASSIFY_CHAIN:-$CLASSIFY_CHAIN_DEFAULT}"
          SLOP_VERIFY_CHAIN="${INPUT_SLOP_VERIFY_CHAIN:-$SLOP_VERIFY_CHAIN_DEFAULT}"
          SYNTHESIS_CHAIN="${INPUT_SYNTHESIS_CHAIN:-$SYNTHESIS_CHAIN_DEFAULT}"

          if [ -z "$FROM_TAG" ] || [ -z "$TO_TAG" ]; then
            echo "::error::from_tag and to_tag are required"
            exit 1
          fi

          {
            echo "from_tag=$FROM_TAG"
            echo "to_tag=$TO_TAG"
            echo "upstream_repo=$UPSTREAM_REPO"
            echo "push_branches=$PUSH_BRANCHES"
            echo "classify_chain=$CLASSIFY_CHAIN"
            echo "slop_verify_chain=$SLOP_VERIFY_CHAIN"
            echo "synthesis_chain=$SYNTHESIS_CHAIN"
          } >> "$GITHUB_OUTPUT"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Export analyzer output dir
        run: echo "ANALYZER_OUTPUT_DIR=${RUNNER_TEMP}/analyzer-output" >> "$GITHUB_ENV"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Run analyzer pipeline
        id: analyze
        env:
          UPSTREAM_REPO: ${{ steps.inputs.outputs.upstream_repo }}
          FROM_TAG: ${{ steps.inputs.outputs.from_tag }}
          TO_TAG: ${{ steps.inputs.outputs.to_tag }}
          CLASSIFY_CHAIN: ${{ steps.inputs.outputs.classify_chain }}
          SLOP_VERIFY_CHAIN: ${{ steps.inputs.outputs.slop_verify_chain }}
          SYNTHESIS_CHAIN: ${{ steps.inputs.outputs.synthesis_chain }}
          PUSH_BRANCHES: ${{ steps.inputs.outputs.push_branches }}
          OUTPUT_DIR: ${{ env.ANALYZER_OUTPUT_DIR }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: bun run script/upstream-analyzer/run.ts

      - name: Upload analyzer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analyzer-output-${{ steps.inputs.outputs.to_tag }}
          path: ${{ env.ANALYZER_OUTPUT_DIR }}/
          retention-days: 30

      - name: Create analysis issue
        id: issue
        uses: actions/github-script@v7
        env:
          OUTPUT_DIR: ${{ env.ANALYZER_OUTPUT_DIR }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const outputDir = process.env.OUTPUT_DIR;
            if (!outputDir) {
              core.setFailed('OUTPUT_DIR env var is empty. Check job-level ANALYZER_OUTPUT_DIR wiring.');
              return;
            }
            const title = (await fs.readFile(path.join(outputDir, 'issue-title.txt'), 'utf8')).trim();
            const body = await fs.readFile(path.join(outputDir, 'issue-body.md'), 'utf8');
            const labels = JSON.parse(await fs.readFile(path.join(outputDir, 'issue-labels.json'), 'utf8'));

            const response = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels,
            });
            core.setOutput('issue_number', response.data.number);
            core.setOutput('issue_url', response.data.html_url);
            core.notice(`Created analysis issue #${response.data.number}`);

      - name: Open draft PRs for batches
        uses: actions/github-script@v7
        env:
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          TO_TAG: ${{ steps.inputs.outputs.to_tag }}
          OUTPUT_DIR: ${{ env.ANALYZER_OUTPUT_DIR }}
        with:
          script: |
            const fs = require('node:fs/promises');
            const path = require('node:path');
            const outputDir = process.env.OUTPUT_DIR;
            if (!outputDir) {
              core.setFailed('OUTPUT_DIR env var is empty. Check job-level ANALYZER_OUTPUT_DIR wiring.');
              return;
            }
            const specs = JSON.parse(await fs.readFile(path.join(outputDir, 'batch-pr-specs.json'), 'utf8'));
            const issueNumber = Number(process.env.ISSUE_NUMBER);

            for (const spec of specs) {
              if (spec.skipped) {
                core.info(`Skipping ${spec.batch} batch: no commits applied`);
                continue;
              }

              try {
                const prBody = spec.body + `\n\nAnalysis: #${issueNumber}`;
                const pr = await github.rest.pulls.create({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  title: spec.title,
                  head: spec.branchName,
                  base: 'dev',
                  body: prBody,
                  draft: true,
                });

                const labels = [
                  'upstream-sync',
                  `batch:${spec.batch.toLowerCase().replace('_', '-')}`,
                  `upstream-tag:${process.env.TO_TAG}`,
                ];
                await github.rest.issues.addLabels({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: pr.data.number,
                  labels,
                });
                core.notice(`Opened draft PR #${pr.data.number} for ${spec.batch} batch`);
              } catch (err) {
                core.warning(`Failed to open PR for ${spec.batch} batch: ${err.message}`);
              }
            }
