name: publish
run-name: "${{ format('release {0}', inputs.version || inputs.bump) }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: "Override version (e.g., 3.0.0-beta.6). Takes precedence over bump."
        required: false
        type: string
      skip_platform:
        description: "Skip platform binary packages"
        required: false
        type: boolean
        default: false

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  id-token: write
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Run tests
        run: bun run script/run-ci-tests.ts

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Type check
        run: bun run typecheck

  publish-main:
    runs-on: ubuntu-latest
    needs: [test, typecheck]
    if: github.repository == 'Vacbo/oh-my-opencode'
    outputs:
      version: ${{ steps.publish.outputs.version }}
      dist_tag: ${{ steps.publish.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Calculate version
        id: version
        env:
          RAW_VERSION: ${{ inputs.version }}
          BUMP: ${{ inputs.bump }}
        run: |
          VERSION="$RAW_VERSION"
          if [ -z "$VERSION" ]; then
            PREV=$(npm view @vacbo/oh-my-opencode version --registry https://registry.npmjs.org 2>/dev/null || echo "0.0.0")
            BASE="${PREV%%-*}"
            IFS='.' read -r MAJOR MINOR PATCH <<< "$BASE"
            case "$BUMP" in
              major) VERSION="$((MAJOR+1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR+1)).0" ;;
              *) VERSION="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            esac
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+(\.[0-9A-Za-z]+)*)?$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT

          if [[ "$VERSION" == *"-"* ]]; then
            DIST_TAG=$(printf '%s' "$VERSION" | cut -d'-' -f2 | cut -d'.' -f1)
            if ! [[ "$DIST_TAG" =~ ^[a-z][a-z0-9-]*$ ]]; then
              echo "::error::Invalid dist_tag: $DIST_TAG"
              exit 1
            fi
            echo "dist_tag=${DIST_TAG:-next}" >> $GITHUB_OUTPUT
          else
            echo "dist_tag=" >> $GITHUB_OUTPUT
          fi

          echo "Version: $VERSION"

      - name: Publish @vacbo/oh-my-opencode
        id: publish
        env:
          RAW_VERSION: ${{ inputs.version }}
          INITIAL_VERSION: ${{ steps.version.outputs.version }}
          DIST_TAG: ${{ steps.version.outputs.dist_tag }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          set -uo pipefail

          version_exists() {
            local version="$1"
            npm view "@vacbo/oh-my-opencode@${version}" version --registry https://registry.npmjs.org >/dev/null 2>&1
          }

          next_patch_version() {
            local version="$1"
            local base="${version%%-*}"
            local suffix=""

            if [[ "$version" == *"-"* ]]; then
              suffix="-${version#*-}"
            fi

            IFS='.' read -r major minor patch <<< "$base"
            echo "${major}.${minor}.$((patch + 1))${suffix}"
          }

          apply_version() {
            local version="$1"

            jq --arg v "$version" '.version = $v' package.json > tmp.json && mv tmp.json package.json

            for platform in darwin-arm64 darwin-x64 darwin-x64-baseline linux-x64 linux-x64-baseline linux-arm64 linux-x64-musl linux-x64-musl-baseline linux-arm64-musl windows-x64 windows-x64-baseline; do
              jq --arg v "$version" '.version = $v' "packages/${platform}/package.json" > tmp.json
              mv tmp.json "packages/${platform}/package.json"
            done

            jq --arg v "$version" '.optionalDependencies = (.optionalDependencies | to_entries | map(.value = $v) | from_entries)' package.json > tmp.json && mv tmp.json package.json
          }

          build_main_package() {
            bun build src/index.ts --outdir dist --target bun --format esm --external @ast-grep/napi
            bun build src/cli/index.ts --outdir dist/cli --target bun --format esm --external @ast-grep/napi
            bunx tsc --emitDeclarationOnly
            bun run build:schema
          }

          publish_main_package() {
            if [ -n "$DIST_TAG" ]; then
              npm publish --access public --provenance --tag "$DIST_TAG" >publish.log 2>&1
            else
              npm publish --access public --provenance >publish.log 2>&1
            fi
          }

          VERSION="$INITIAL_VERSION"

          while true; do
            if version_exists "$VERSION"; then
              if [ -n "$RAW_VERSION" ]; then
                echo "::error::@vacbo/oh-my-opencode@${VERSION} is already published"
                exit 1
              fi

              echo "@vacbo/oh-my-opencode@${VERSION} is already visible on npm. Trying next patch version."
              VERSION="$(next_patch_version "$VERSION")"
              continue
            fi

            apply_version "$VERSION"
            build_main_package

            if publish_main_package; then
              cat publish.log
              echo "version=$VERSION" >> "$GITHUB_OUTPUT"
              echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"
              break
            fi

            cat publish.log

            if [ -n "$RAW_VERSION" ]; then
              exit 1
            fi

            if grep -q 'Cannot publish over previously published version' publish.log; then
              VERSION="$(next_patch_version "$VERSION")"
              echo "Immutable npm version collision detected. Retrying with ${VERSION}."
              continue
            fi

            exit 1
          done

  build-platform:
    needs: publish-main
    if: github.repository == 'Vacbo/oh-my-opencode' && inputs.skip_platform != true
    runs-on: ${{ startsWith(matrix.platform, 'windows-') && 'windows-latest' || startsWith(matrix.platform, 'darwin-') && 'macos-latest' || 'ubuntu-latest' }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      max-parallel: 11
      matrix:
        platform:
          [
            darwin-arm64,
            darwin-x64,
            darwin-x64-baseline,
            linux-x64,
            linux-x64-baseline,
            linux-arm64,
            linux-x64-musl,
            linux-x64-musl-baseline,
            linux-arm64-musl,
            windows-x64,
            windows-x64-baseline,
          ]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Check if already published
        id: check
        env:
          VERSION: ${{ needs.publish-main.outputs.version }}
        run: |
          if npm view "@vacbo/oh-my-opencode-${{ matrix.platform }}@${VERSION}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "✓ @vacbo/oh-my-opencode-${{ matrix.platform }}@${VERSION} already published"
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "→ @vacbo/oh-my-opencode-${{ matrix.platform }}@${VERSION} needs publishing"
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Update version in package.json
        if: steps.check.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.publish-main.outputs.version }}
        run: |
          cd packages/${{ matrix.platform }}
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Set root package version
        if: steps.check.outputs.skip != 'true'
        env:
          VERSION: ${{ needs.publish-main.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json

      - name: Pre-download baseline compile target
        if: steps.check.outputs.skip != 'true' && endsWith(matrix.platform, '-baseline')
        run: |
          BUN_VERSION=$(bun --version)
          PLATFORM="${{ matrix.platform }}"
          PKG_NAME="bun-${PLATFORM}"
          CACHE_DIR=$(bun pm cache)
          CACHE_DEST="${CACHE_DIR}/${PKG_NAME}-v${BUN_VERSION}"

          if [[ -f "$CACHE_DEST" ]]; then
            echo "✓ Compile target already cached at ${CACHE_DEST}"
            exit 0
          fi

          echo "Pre-downloading ${PKG_NAME} v${BUN_VERSION} to ${CACHE_DEST}"
          TARBALL_URL="https://registry.npmjs.org/@oven/bun-${PLATFORM}/-/bun-${PLATFORM}-${BUN_VERSION}.tgz"
          mkdir -p "$(dirname "$CACHE_DEST")"
          TMP_DIR=$(mktemp -d)
          curl -fsSL --retry 5 --retry-delay 5 "${TARBALL_URL}" | tar -xzf - -C "${TMP_DIR}"

          if [[ "$PLATFORM" == windows-* ]]; then
            BIN_NAME="bun.exe"
          else
            BIN_NAME="bun"
          fi

          if [[ -f "${TMP_DIR}/package/bin/${BIN_NAME}" ]]; then
            cp "${TMP_DIR}/package/bin/${BIN_NAME}" "${CACHE_DEST}"
          elif [[ -f "${TMP_DIR}/package/${BIN_NAME}" ]]; then
            cp "${TMP_DIR}/package/${BIN_NAME}" "${CACHE_DEST}"
          else
            echo "Could not find ${BIN_NAME} in tarball"
            find "${TMP_DIR}" -type f
            exit 1
          fi

          chmod +x "${CACHE_DEST}" 2>/dev/null || true
          ls -lh "${CACHE_DEST}"

      - name: Build binary
        if: steps.check.outputs.skip != 'true'
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 5
          retry_wait_seconds: 10
          shell: bash
          command: |
            PLATFORM="${{ matrix.platform }}"
            case "$PLATFORM" in
              darwin-arm64) TARGET="bun-darwin-arm64" ;;
              darwin-x64) TARGET="bun-darwin-x64" ;;
              darwin-x64-baseline) TARGET="bun-darwin-x64-baseline" ;;
              linux-x64) TARGET="bun-linux-x64" ;;
              linux-x64-baseline) TARGET="bun-linux-x64-baseline" ;;
              linux-arm64) TARGET="bun-linux-arm64" ;;
              linux-x64-musl) TARGET="bun-linux-x64-musl" ;;
              linux-x64-musl-baseline) TARGET="bun-linux-x64-musl-baseline" ;;
              linux-arm64-musl) TARGET="bun-linux-arm64-musl" ;;
              windows-x64) TARGET="bun-windows-x64" ;;
              windows-x64-baseline) TARGET="bun-windows-x64-baseline" ;;
            esac

            if [[ "$PLATFORM" == windows-* ]]; then
              OUTPUT="packages/${PLATFORM}/bin/oh-my-opencode.exe"
            else
              OUTPUT="packages/${PLATFORM}/bin/oh-my-opencode"
            fi

            bun build src/cli/index.ts --compile --minify --target=$TARGET --outfile=$OUTPUT
            ls -lh "$OUTPUT"

      - name: Ad-hoc sign darwin binary
        if: steps.check.outputs.skip != 'true' && startsWith(matrix.platform, 'darwin-')
        run: |
          BINARY="packages/${{ matrix.platform }}/bin/oh-my-opencode"
          codesign --remove-signature "$BINARY" 2>/dev/null || true
          codesign --sign - --force --timestamp=none "$BINARY"
          codesign --verify --verbose "$BINARY"

      - name: Compress binary
        if: steps.check.outputs.skip != 'true'
        run: |
          PLATFORM="${{ matrix.platform }}"
          cd packages/${PLATFORM}
          if [[ "$PLATFORM" == windows-* ]]; then
            7z a -tzip ../../binary-${PLATFORM}.zip bin/ package.json
          else
            tar -czvf ../../binary-${PLATFORM}.tar.gz bin/ package.json
          fi
          cd ../..
          ls -lh binary-${PLATFORM}.*

      - name: Upload artifact
        if: steps.check.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: |
            binary-${{ matrix.platform }}.tar.gz
            binary-${{ matrix.platform }}.zip
          retention-days: 1
          if-no-files-found: error

  publish-platform:
    needs: [publish-main, build-platform]
    if: github.repository == 'Vacbo/oh-my-opencode' && inputs.skip_platform != true && always() && !cancelled()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        platform:
          [
            darwin-arm64,
            darwin-x64,
            darwin-x64-baseline,
            linux-x64,
            linux-x64-baseline,
            linux-arm64,
            linux-x64-musl,
            linux-x64-musl-baseline,
            linux-arm64-musl,
            windows-x64,
            windows-x64-baseline,
          ]
    steps:
      - name: Check if already published
        id: check
        env:
          VERSION: ${{ needs.publish-main.outputs.version }}
        run: |
          if npm view "@vacbo/oh-my-opencode-${{ matrix.platform }}@${VERSION}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "skip_publish=true" >> $GITHUB_OUTPUT
            echo "✓ @vacbo/oh-my-opencode-${{ matrix.platform }}@${VERSION} already published"
            echo "skip_all=true" >> $GITHUB_OUTPUT
          else
            echo "skip_publish=false" >> $GITHUB_OUTPUT
            echo "skip_all=false" >> $GITHUB_OUTPUT
          fi

      - name: Download artifact
        id: download
        if: steps.check.outputs.skip_all != 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: binary-${{ matrix.platform }}
          path: .

      - name: Extract artifact
        if: steps.check.outputs.skip_all != 'true' && steps.download.outcome == 'success'
        run: |
          PLATFORM="${{ matrix.platform }}"
          mkdir -p packages/${PLATFORM}
          if [[ "$PLATFORM" == windows-* ]]; then
            unzip binary-${PLATFORM}.zip -d packages/${PLATFORM}/
          else
            tar -xzvf binary-${PLATFORM}.tar.gz -C packages/${PLATFORM}/
          fi
          ls -la packages/${PLATFORM}/
          ls -la packages/${PLATFORM}/bin/

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip_all != 'true' && steps.download.outcome == 'success'
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Publish @vacbo/oh-my-opencode-${{ matrix.platform }}
        if: steps.check.outputs.skip_publish != 'true' && steps.download.outcome == 'success'
        env:
          DIST_TAG: ${{ needs.publish-main.outputs.dist_tag }}
          NPM_CONFIG_PROVENANCE: true
        run: |
          cd packages/${{ matrix.platform }}
          if [ -n "$DIST_TAG" ]; then
            npm publish --access public --provenance --tag "$DIST_TAG"
          else
            npm publish --access public --provenance
          fi
        timeout-minutes: 15

  release:
    runs-on: ubuntu-latest
    needs: [publish-main, publish-platform]
    if: always() && needs.publish-main.result == 'success' && (inputs.skip_platform == true || needs.publish-platform.result == 'success')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - run: git fetch --force --tags

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        env:
          BUN_INSTALL_ALLOW_SCRIPTS: "@ast-grep/napi"

      - name: Generate changelog
        run: |
          bun run script/generate-changelog.ts > /tmp/changelog.md
          cat /tmp/changelog.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply release version to source tree
        env:
          VERSION: ${{ needs.publish-main.outputs.version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' package.json > tmp.json && mv tmp.json package.json
          for platform in darwin-arm64 darwin-x64 darwin-x64-baseline linux-x64 linux-x64-baseline linux-arm64 linux-x64-musl linux-x64-musl-baseline linux-arm64-musl windows-x64 windows-x64-baseline; do
            jq --arg v "$VERSION" '.version = $v' "packages/${platform}/package.json" > tmp.json
            mv tmp.json "packages/${platform}/package.json"
          done
          jq --arg v "$VERSION" '.optionalDependencies = (.optionalDependencies | to_entries | map(.value = $v) | from_entries)' package.json > tmp.json && mv tmp.json package.json

      - name: Commit version bump
        env:
          VERSION: ${{ needs.publish-main.outputs.version }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add package.json packages/*/package.json
          git diff --cached --quiet || git commit -m "release: v${VERSION}"

      - name: Create release tag
        env:
          VERSION: ${{ needs.publish-main.outputs.version }}
        run: |
          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${VERSION} already exists"
            exit 1
          fi
          git tag "v${VERSION}"

      - name: Push release state
        env:
          VERSION: ${{ needs.publish-main.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HEAD
          git push origin "v${VERSION}"

      - name: Create GitHub release
        env:
          VERSION: ${{ needs.publish-main.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "v${VERSION}" >/dev/null 2>&1 || \
            gh release create "v${VERSION}" --title "v${VERSION}" --notes-file /tmp/changelog.md

      - name: Delete draft release
        run: gh release delete next --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge to master
        continue-on-error: true
        env:
          VERSION: ${{ needs.publish-main.outputs.version }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked || true
          git checkout master
          git reset --hard "v${VERSION}"
          git push -f origin master || echo "::warning::Failed to push to master"
